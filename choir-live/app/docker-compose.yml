services:
  signaling:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    restart: unless-stopped
# TURN is a separate public UDP/TCP service. Configure coturn with
# use-auth-secret, static-auth-secret matching TURN_SECRET, realm,
# external-ip and TLS certificates. See DEPLOYMENT_V02.md.
