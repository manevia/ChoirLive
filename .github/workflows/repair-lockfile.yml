name: Repair frontend lockfile (one-time)
on:
  push:
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate dependency lockfile
        working-directory: choir-live/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        working-directory: choir-live/app
        run: npm ci --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- choir-live/app/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add choir-live/app/package-lock.json
            git commit -m "Regenerate frontend lockfile for reproducible builds"
            git push origin HEAD:main
          fi
