name: ChoirLive and ChoirCore checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choir-live/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: choir-live/app/package-lock.json
      # Temporary until package-lock.json is regenerated to match package.json.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build

  media-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choircore/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: node --check ../sdk/index.mjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q choir-live/app
