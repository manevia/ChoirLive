name: ChoirLive and ChoirCore checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choir-live/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: choir-live/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  media-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: choircore/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node --check ../sdk/index.mjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q choir-live/app

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ChoirCore deployment image
        run: docker build --tag choircore:ci ./choircore/server
      - name: Confirm image architecture and runtime command
        run: docker image inspect choircore:ci --format '{{.Os}}/{{.Architecture}} {{json .Config.Cmd}}'
      - name: Start media container and verify health
        shell: bash
        run: |
          docker run -d --name choircore-ci --network host \
            -e PORT=18091 -e ANNOUNCED_IP=127.0.0.1 \
            -e CHOIRCORE_SINGER_CODE=integration-singer-secret-123 \
            -e CHOIRCORE_CONDUCTOR_CODE=integration-conductor-secret-456 \
            -e CHOIRCORE_ENGINEER_CODE=integration-engineer-secret-789 \
            -e CHOIRCORE_ALLOWED_ORIGINS=https://choirlive.example.test \
            choircore:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18091/health; then exit 0; fi
            sleep 2
          done
          docker logs choircore-ci
          exit 1
      - name: Stop media container
        if: always()
        run: docker rm -f choircore-ci || true

  browser-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: choir-live/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Install ChoirCore media-server dependencies
        working-directory: choircore/server
        run: npm install --no-audit --no-fund
      - run: node test/browser-media.mjs

  deployment-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment configuration using disposable CI values
        env:
          NODE_ENV: production
          ANNOUNCED_IP: 203.0.113.10
          CHOIRCORE_SINGER_CODE: integration-singer-secret-123456
          CHOIRCORE_CONDUCTOR_CODE: integration-conductor-secret-123456
          CHOIRCORE_ENGINEER_CODE: integration-engineer-secret-123456
          CHOIRCORE_ALLOWED_ORIGINS: https://choir.example.test
          CHOIRCORE_SIGNALING_URL: wss://signal.example.test
        run: node scripts/choircore-preflight.mjs
