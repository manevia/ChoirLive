# Coolify deployment: route signaling through the reverse proxy on port 8090.
# Publish only the approved UDP media range on the VPS.
services:
  choircore:
    build:
      context: ./choircore/server
    restart: unless-stopped
    expose:
      - "8090"
    ports:
      - "40000-40100:40000-40100/udp"
    volumes:
      - choircore-accounts:/app/data
    environment:
      PORT: "8090"
      ANNOUNCED_IP: "${ANNOUNCED_IP:?Public media host IP required}"
      CHOIRCORE_SINGER_CODE: "${CHOIRCORE_SINGER_CODE:?Singer code required}"
      CHOIRCORE_CONDUCTOR_CODE: "${CHOIRCORE_CONDUCTOR_CODE:?Conductor code required}"
      CHOIRCORE_ADMIN_CODE: "${CHOIRCORE_ADMIN_CODE:-}"
      CHOIRCORE_ENGINEER_CODE: "${CHOIRCORE_ENGINEER_CODE:?Engineer code required}"
      CHOIRCORE_ALLOWED_ORIGINS: "${CHOIRCORE_ALLOWED_ORIGINS:?Allowed browser origins required}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-100}"
      MAX_PEERS_PER_ROOM: "${MAX_PEERS_PER_ROOM:-12}"
      MAX_ROOMS: "${MAX_ROOMS:-20}"
      MAX_AUTH_FAILURES: "${MAX_AUTH_FAILURES:-10}"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  choircore-accounts:
